<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Gallery Panel — AZRA SOFA</title>


    <!-- GOOGLE FONT -->

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet">


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SUPABASE CONFIG -->

    <script src="js/supabase-config.js"></script>


    <style>
        .gallery-image-preview {

            display: none;

            width: 100%;

            max-width: 400px;

            margin-top: 15px;

            border-radius: 10px;

            object-fit: cover;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);

        }

        .gallery-image-info {

            display: block;

            margin-top: 8px;

            font-size: 12px;

            color: #888;

            line-height: 1.5;
        }

        .gallery-id-wrapper {
            position: relative;
        }

        .gallery-id-suggestions {
            display: none;

            position: absolute;

            top: calc(100% + 5px);
            left: 0;
            right: 0;

            max-height: 220px;

            overflow-y: auto;

            background: #ffffff;

            border: 1px solid #ddd;

            border-radius: 8px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);

            z-index: 1000;
        }

        .gallery-id-suggestions.active {
            display: block;
        }

        .gallery-id-suggestion-title {
            padding: 10px 14px;

            font-size: 11px;

            font-weight: 600;

            color: #999;

            border-bottom: 1px solid #eee;
        }

        .gallery-id-suggestion {
            padding: 10px 14px;

            font-family: "Montserrat", sans-serif;

            font-size: 13px;

            color: #6b4f3a;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .gallery-id-suggestion:hover {
            background: #f7f3ed;
        }

        .gallery-id-empty {
            padding: 10px 14px;

            font-size: 12px;

            color: #999;
        }

        .gallery-card-id {

            display: block;

            margin-bottom: 8px;

            font-size: 11px;

            color: #999;

            word-break: break-all;

        }


        .gallery-card-actions {

            display: flex;

            gap: 10px;

            margin-top: 16px;

        }


        .edit-gallery-button,
        .delete-gallery-button {

            flex: 1;

            border: none;

            padding: 10px 12px;

            border-radius: 7px;

            font-family: "Montserrat", sans-serif;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;

        }


        .edit-gallery-button {

            background: #a77b5d;

            color: #ffffff;

        }


        .edit-gallery-button:hover {

            background: #6b4f3a;

        }


        .delete-gallery-button {

            background: #eeeeee;

            color: #a33a2b;

        }


        .delete-gallery-button:hover {

            background: #fce8e6;

        }

        .admin-header-actions {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .add-gallery-button {

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            background: #a77b5d;

            color: #ffffff;

            font-family: "Montserrat", sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;

        }

        .add-gallery-button:hover {

            background: #ffffff;

            color: #6b4f3a;

            transform: translateY(-1px);

        }

        .gallery-form-container {
            display: none;

            max-width: 700px;

            margin: 30px auto;

            padding: 30px;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }


        .gallery-form-container.active {
            display: block;
        }


        .gallery-form-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }


        .gallery-form-header h2 {
            color: #6b4f3a;

            font-size: 22px;
        }


        .close-form-button {
            border: none;

            background: transparent;

            font-size: 28px;

            color: #777;

            cursor: pointer;
        }


        .gallery-form-container .form-group {
            margin-bottom: 18px;
        }


        .gallery-form-container label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;
        }


        .gallery-form-container input,
        .gallery-form-container select,
        .gallery-form-container textarea {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-family: "Montserrat", sans-serif;

            font-size: 14px;

            transition: 0.25s ease;

        }


        .gallery-form-container textarea {
            resize: vertical;
        }


        .gallery-form-container input:focus,
        .gallery-form-container select:focus,
        .gallery-form-container textarea:focus {

            border-color: #a77b5d;

            box-shadow:
                0 0 0 3px rgba(167, 123, 93, 0.12);

        }


        .form-actions {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }


        .save-gallery-button,
        .cancel-gallery-button {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-family: "Montserrat", sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;
        }


        .save-gallery-button {
            background: #a77b5d;

            color: #ffffff;
        }


        .save-gallery-button:hover {
            background: #6b4f3a;
        }


        .cancel-gallery-button {
            background: #eeeeee;

            color: #444;
        }


        .cancel-gallery-button:hover {
            background: #dddddd;
        }


        .gallery-form-message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;
        }


        .gallery-form-message.success {
            display: block;

            background: #e8f5e9;

            color: #2e7d32;
        }


        .gallery-form-message.error {
            display: block;

            background: #fce8e6;

            color: #a33a2b;
        }


        @media (max-width: 600px) {

            .gallery-form-container {
                padding: 22px;
            }


            .form-actions {
                flex-direction: column;
            }


            .save-gallery-button,
            .cancel-gallery-button {
                width: 100%;
            }

        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background: #f7f3ed;

            color: #252321;

            font-family: "Montserrat", sans-serif;

        }


        .admin-header {

            background: #6b4f3a;

            color: #ffffff;

            padding: 20px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .admin-header h1 {

            font-size: 22px;

            letter-spacing: 0.5px;

        }


        .admin-header p {

            margin-top: 5px;

            font-family: "Playfair Display", serif;

            font-size: 13px;

            opacity: 0.85;

        }


        .logout-button {

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            background: #ffffff;

            color: #6b4f3a;

            font-family: "Montserrat", sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;

        }


        .logout-button:hover {

            transform: translateY(-1px);

            opacity: 0.9;

        }


        .admin-container {

            width: 88%;

            max-width: 1200px;

            margin: 40px auto;

        }


        .admin-info {

            background: #ffffff;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06);

            margin-bottom: 25px;

        }


        .admin-info h2 {

            color: #6b4f3a;

            font-size: 20px;

            margin-bottom: 10px;

        }


        .admin-info p {

            font-size: 14px;

            color: #666;

            line-height: 1.6;

        }


        .gallery-status {

            margin-top: 12px;

            font-weight: 600;

        }


        .gallery-list {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

        }


        .gallery-card {

            background: #ffffff;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06);

        }


        .gallery-card img {

            width: 100%;

            aspect-ratio: 16 / 10;

            object-fit: cover;

            display: block;

        }


        .gallery-card-content {

            padding: 18px;

        }


        .gallery-card-content h3 {

            font-size: 15px;

            color: #6b4f3a;

            margin-bottom: 8px;

        }


        .gallery-card-content p {

            font-family: "Playfair Display", serif;

            font-size: 14px;

            color: #666;

            line-height: 1.5;

        }


        @media (max-width: 800px) {

            .gallery-list {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 520px) {

            .admin-header-actions {
                gap: 6px;
            }

            .add-gallery-button {
                padding: 9px 12px;
                font-size: 12px;
            }

            .admin-header {

                padding: 18px 5%;

            }

            .admin-header h1 {

                font-size: 18px;

            }

            .logout-button {

                padding: 9px 13px;

                font-size: 12px;

            }

            .admin-container {

                width: 90%;

                margin: 25px auto;

            }

            .gallery-list {

                grid-template-columns: 1fr;

            }

        }

        /* ==================================================
   ADD GALLERY CARD
================================================== */

        .add-gallery-card {
            min-height: 100%;
            min-height: 320px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px dashed #c9b19e;
            border-radius: 14px;

            background: rgba(167, 123, 93, 0.04);

            cursor: pointer;

            transition:
                0.25s ease;
        }

        .add-gallery-card:hover {
            background: rgba(167, 123, 93, 0.10);

            border-color: #a77b5d;

            transform: translateY(-3px);
        }

        .add-gallery-card-content {
            text-align: center;
            color: #a77b5d;
        }

        .add-gallery-card-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #a77b5d;
            color: #ffffff;

            font-size: 30px;
            font-weight: 400;

            transition: 0.25s ease;
        }

        .add-gallery-card:hover .add-gallery-card-icon {
            background: #6b4f3a;

            transform: scale(1.08);
        }

        .add-gallery-card-content h3 {
            margin-bottom: 6px;

            color: #6b4f3a;

            font-family: "Montserrat", sans-serif;
            font-size: 15px;
        }

        .add-gallery-card-content p {
            color: #888;

            font-family: "Playfair Display", serif;
            font-size: 13px;
        }


        /* ==================================================
   FLOATING ADD GALLERY BUTTON
================================================== */

        .floating-add-gallery-button {

            position: fixed;

            right: 24px;

            bottom: 24px;

            width: 52px;

            height: 52px;

            border: none;

            border-radius: 50%;

            background: #a77b5d;

            color: #ffffff;

            font-family: "Montserrat", sans-serif;

            font-size: 28px;

            font-weight: 500;

            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.18);

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(15px) scale(0.9);

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease,
                transform 0.25s ease,
                background 0.25s ease;

            z-index: 9999;
        }


        .floating-add-gallery-button.visible {

            opacity: 1;

            visibility: visible;

            transform:
                translateY(0) scale(1);

        }


        .floating-add-gallery-button:hover {

            background: #6b4f3a;

            transform:
                translateY(-3px) scale(1.03);

        }


        /* ==================================================
   MOBILE
================================================== */

        @media (max-width: 520px) {

            .floating-add-gallery-button {

                width: 48px;

                height: 48px;

                right: 18px;

                bottom: 18px;

                font-size: 25px;

            }

        }
    </style>

</head>

<body>

    <header class="admin-header">

        <div>

            <h1>
                AZRA SOFA
            </h1>

            <p>
                Gallery Administration
            </p>

        </div>

        <div class="admin-header-actions">

            <button id="addGalleryButton" class="add-gallery-button">
                + Tambah Gallery
            </button>

            <button id="logoutButton" class="logout-button">
                Logout
            </button>

        </div>
    </header>

    <div id="galleryFormContainer" class="gallery-form-container">

        <div class="gallery-form-header">
            <h2>Tambah Gallery</h2>

            <button type="button" id="closeGalleryForm" class="close-form-button">
                ×
            </button>
        </div>


        <form id="galleryForm">

            <!-- ==================================================
         1. GAMBAR GALLERY
    ================================================== -->

            <div class="form-group">

                <label for="galleryImage">
                    1. Gambar Gallery
                </label>

                <input type="file" id="galleryImage" accept="image/*">

                <small id="galleryImageInfo" class="gallery-image-info">
                    Pilih gambar dari komputer.
                </small>

                <img id="galleryImagePreview" class="gallery-image-preview" alt="Preview Gallery">

            </div>


            <!-- ==================================================
         2. KATEGORI
    ================================================== -->

            <div class="form-group">

                <label for="galleryCategory">
                    2. Kategori
                </label>

                <select id="galleryCategory" required>

                    <option value="">
                        Pilih kategori
                    </option>

                    <option value="custom">
                        Custom Sofa
                    </option>

                    <option value="repair">
                        Repair Sofa
                    </option>

                    <option value="details">
                        Details
                    </option>

                </select>

                <small class="gallery-image-info">
                    Pilih kategori terlebih dahulu untuk menentukan ID Gallery.
                </small>

            </div>


            <!-- ==================================================
         3. ID GALLERY
    ================================================== -->

            <div class="form-group">

                <label for="galleryId">
                    3. ID Gallery
                </label>

                <div class="gallery-id-wrapper">

                    <input type="text" id="galleryId" placeholder="Pilih kategori terlebih dahulu" autocomplete="off"
                        required disabled readonly>

                    <div id="galleryIdSuggestions" class="gallery-id-suggestions"></div>

                </div>

                <small id="galleryIdInfo" class="gallery-image-info">
                    ID akan dibuat otomatis setelah kategori dipilih.
                </small>

            </div>


            <!-- ==================================================
         4. JUDUL
    ================================================== -->

            <div class="form-group">

                <label for="galleryTitle">
                    4. Judul
                </label>

                <input type="text" id="galleryTitle" placeholder="Contoh: Sofa L Minimalis" required>

            </div>


            <!-- ==================================================
         5. CAPTION
    ================================================== -->

            <div class="form-group">

                <label for="galleryCaption">
                    5. Caption
                </label>

                <textarea id="galleryCaption" rows="4" placeholder="Deskripsi singkat gallery..."></textarea>

            </div>


            <!-- ==================================================
         6. ACTION
    ================================================== -->

            <div class="form-actions">

                <button type="submit" class="save-gallery-button">
                    Simpan Gallery
                </button>

                <button type="button" id="cancelGalleryForm" class="cancel-gallery-button">
                    Batal
                </button>

            </div>


            <!-- ==================================================
         FORM MESSAGE
    ================================================== -->

            <div id="galleryFormMessage" class="gallery-form-message"></div>

        </form>

    </div>

    <main class="admin-container">


        <section class="admin-info">

            <h2>
                Admin Gallery
            </h2>

            <p id="adminUser">
                Memeriksa session admin...
            </p>

            <p id="galleryStatus" class="gallery-status">
                Memuat Gallery...
            </p>

        </section>


        <section id="galleryList" class="gallery-list"></section>


    </main>


    <script>

        /* ==================================================
           GALLERY FORM STATE
        ================================================== */

        let editingGalleryId = null;
        let editingGalleryImageUrl = null;

        let selectedGalleryFile = null;


        /* ==================================================
           GALLERY ID SYSTEM
        ================================================== */

        const galleryIdInput =
            document.getElementById("galleryId");

        const galleryCategory =
            document.getElementById("galleryCategory");

        const galleryIdSuggestions =
            document.getElementById("galleryIdSuggestions");

        const galleryIdInfo =
            document.getElementById("galleryIdInfo");


        /* ==================================================
           GALLERY ID STATE
        ================================================== */

        let galleryIds = [];


        /* ==================================================
           CATEGORY → ID PREFIX
        ================================================== */

        const galleryIdPrefixMap = {
            custom: "custom",
            repair: "repair",
            details: "detail"
        };


        /* ==================================================
           LOAD GALLERY IDS
        ================================================== */

        async function loadGalleryIds() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("gallery")
                    .select("id, category")
                    .order("id", {
                        ascending: true
                    });


            if (error) {

                console.error(
                    "❌ Gagal mengambil ID Gallery:",
                    error
                );

                galleryIds = [];

                return;

            }


            /*
               Simpan dalam bentuk object:
        
               {
                   id: "custom-001",
                   category: "custom"
               }
            */

            galleryIds = data || [];


            console.log(
                "✅ ID Gallery berhasil dimuat:",
                galleryIds
            );

        }


        /* ==================================================
           GET IDS BY CATEGORY
        ================================================== */

        function getGalleryIdsByCategory(category) {

            const prefix =
                galleryIdPrefixMap[category];

            if (!prefix) {
                return [];
            }


            return galleryIds
                .map(item => item.id)
                .filter(id => {

                    return id
                        .toLowerCase()
                        .startsWith(
                            prefix.toLowerCase() + "-"
                        );

                });

        }


        /* ==================================================
           GET NEXT AVAILABLE ID
        ================================================== */

        function getNextAvailableGalleryId(category) {

            const prefix =
                galleryIdPrefixMap[category];

            if (!prefix) {
                return null;
            }


            const categoryIds =
                getGalleryIdsByCategory(category);


            const usedNumbers =
                categoryIds
                    .map(id => {

                        const match =
                            id.match(
                                new RegExp(
                                    `^${prefix}-(\\d+)$`,
                                    "i"
                                )
                            );

                        return match
                            ? parseInt(match[1], 10)
                            : null;

                    })
                    .filter(
                        number =>
                            number !== null &&
                            !isNaN(number)
                    );


            let nextNumber = 1;


            while (
                usedNumbers.includes(nextNumber)
            ) {

                nextNumber++;

            }


            return (
                `${prefix}-` +
                String(nextNumber).padStart(3, "0")
            );

        }


        /* ==================================================
           SHOW GALLERY ID SUGGESTIONS
        ================================================== */

        function showGalleryIdSuggestions() {

            /*
               Jangan tampilkan saat EDIT
            */

            if (editingGalleryId) {

                galleryIdSuggestions.classList.remove(
                    "active"
                );

                return;

            }


            const category =
                galleryCategory.value;


            /*
               Belum pilih kategori
            */

            if (!category) {

                galleryIdSuggestions.classList.remove(
                    "active"
                );

                galleryIdSuggestions.innerHTML = "";

                return;

            }


            const prefix =
                galleryIdPrefixMap[category];


            if (!prefix) {

                return;

            }


            /*
               Ambil semua ID kategori
            */

            const categoryIds =
                getGalleryIdsByCategory(category);


            /*
               Urutkan berdasarkan nomor
            */

            const numberedIds =
                categoryIds
                    .map(id => {

                        const match =
                            id.match(
                                new RegExp(
                                    `^${prefix}-(\\d+)$`,
                                    "i"
                                )
                            );

                        if (!match) {
                            return null;
                        }

                        return {
                            id: id,
                            number: parseInt(
                                match[1],
                                10
                            )
                        };

                    })
                    .filter(Boolean)
                    .sort(
                        (a, b) =>
                            a.number - b.number
                    );


            /*
               Cari nomor yang kosong.
        
               Contoh:
        
               custom-001
               custom-003
               custom-004
        
               Maka:
               custom-002
            */

            let availableNumber = 1;


            for (
                const item of numberedIds
            ) {

                if (
                    item.number ===
                    availableNumber
                ) {

                    availableNumber++;

                } else if (
                    item.number >
                    availableNumber
                ) {

                    break;

                }

            }


            const recommendedId =
                `${prefix}-${String(
                    availableNumber
                ).padStart(3, "0")}`;


            /*
               Ambil 5 ID terakhir
            */

            const lastFiveIds =
                [...numberedIds]
                    .sort(
                        (a, b) =>
                            b.number - a.number
                    )
                    .slice(0, 5);


            /*
               Bersihkan dropdown
            */

            galleryIdSuggestions.innerHTML = "";


            /*
               ==============================
               RECOMMENDATION
               ==============================
            */

            const recommendationTitle =
                document.createElement("div");

            recommendationTitle.className =
                "gallery-id-suggestion-title";

            recommendationTitle.textContent =
                "ID yang direkomendasikan";

            galleryIdSuggestions.appendChild(
                recommendationTitle
            );


            const recommendation =
                document.createElement("div");

            recommendation.className =
                "gallery-id-suggestion";

            recommendation.innerHTML =
                `<strong>✨ ${recommendedId}</strong>`;


            recommendation.addEventListener(
                "click",
                function () {

                    galleryIdInput.value =
                        recommendedId;

                    galleryIdInfo.textContent =
                        `ID ${recommendedId} dipilih.`;

                    galleryIdSuggestions.classList.remove(
                        "active"
                    );

                    galleryIdInput.focus();

                }
            );


            galleryIdSuggestions.appendChild(
                recommendation
            );


            /*
               ==============================
               5 ID TERAKHIR
               ==============================
            */

            if (lastFiveIds.length) {

                const recentTitle =
                    document.createElement("div");

                recentTitle.className =
                    "gallery-id-suggestion-title";

                recentTitle.textContent =
                    "5 ID terakhir digunakan";

                galleryIdSuggestions.appendChild(
                    recentTitle
                );


                lastFiveIds.forEach(
                    function (item) {

                        const suggestion =
                            document.createElement(
                                "div"
                            );

                        suggestion.className =
                            "gallery-id-suggestion";

                        suggestion.textContent =
                            item.id;


                        suggestion.addEventListener(
                            "click",
                            function () {

                                galleryIdInput.value =
                                    item.id;

                                galleryIdInfo.textContent =
                                    `ID ${item.id} dipilih.`;

                                galleryIdSuggestions.classList.remove(
                                    "active"
                                );

                                galleryIdInput.focus();

                            }
                        );


                        galleryIdSuggestions.appendChild(
                            suggestion
                        );

                    }

        async function deleteGalleryItem(id, deleteButton) {

            /* ================= KONFIRMASI ================= */

            const confirmed =
                confirm(
                    `Yakin ingin menghapus Gallery "${id}"?\n\n` +
                    `Data yang dihapus tidak dapat dikembalikan.`
                );


            if (!confirmed) {

                console.log(
                    `ℹ️ Penghapusan Gallery "${id}" dibatalkan.`
                );

                return;

            }


            /* ================= BUTTON ================= */

            if (deleteButton) {

                deleteButton.disabled = true;

                deleteButton.textContent =
                    "Menghapus...";

            }

            await new Promise(resolve => setTimeout(resolve, 500));

            /* ================= DELETE ================= */

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("gallery")
                    .delete()
                    .eq("id", id)
                    .select();


            /* ================= ERROR ================= */

            if (error) {

                console.error(
                    `❌ Gagal menghapus Gallery "${id}":`,
                    error
                );


                if (deleteButton) {

                    deleteButton.disabled =
                        false;

                    deleteButton.textContent =
                        "Hapus";

                }


                document.getElementById(
                    "galleryStatus"
                ).textContent =
                    "Gagal menghapus Gallery.";

                return;

            }


            /* ================= CEK HASIL ================= */

            if (!data || data.length === 0) {

                console.warn(
                    `⚠️ Gallery "${id}" tidak ditemukan atau tidak dapat dihapus.`
                );


                if (deleteButton) {

                    deleteButton.disabled =
                        false;

                    deleteButton.textContent =
                        "Hapus";

                }


                document.getElementById(
                    "galleryStatus"
                ).textContent =
                    "Gallery tidak ditemukan atau tidak dapat dihapus.";

                return;

            }


            /* ================= SUCCESS ================= */

            console.log(
                `✅ Gallery "${id}" berhasil dihapus:`,
                data
            );


            /* ================= REFRESH ================= */

            await loadGalleryIds();

            await loadAdminGallery(
                "Gallery berhasil dihapus."
            );
        }

        /* ==================================================
           UPLOAD GALLERY IMAGE
        ================================================== */

        async function uploadGalleryImage(file) {

            if (!file) {

                console.warn(
                    "⚠️ Tidak ada file gambar."
                );

                return null;

            }


            /* ================= NAMA FILE ================= */

            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                `${Date.now()}-${crypto.randomUUID()}.${fileExtension}`;


            const filePath =
                fileName;


            console.log(
                "📤 Mulai upload:",
                filePath
            );


            /* ================= UPLOAD ================= */

            const {
                error
            } =
                await supabaseClient
                    .storage
                    .from("gallery-images")
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl: "3600",
                            upsert: false
                        }
                    );


            if (error) {

                console.error(
                    "❌ Upload gambar gagal:",
                    error
                );

                return null;

            }


            /* ================= PUBLIC URL ================= */

            const {
                data
            } =
                supabaseClient
                    .storage
                    .from("gallery-images")
                    .getPublicUrl(
                        filePath
                    );


            const publicUrl =
                data.publicUrl;


            console.log(
                "✅ Upload berhasil."
            );

            console.log(
                "🔗 Public URL:",
                publicUrl
            );


            return publicUrl;

        }

        /* ==================================================
           SUBMIT GALLERY
        ================================================== */

        galleryForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const id =
                    document
                        .getElementById("galleryId")
                        .value
                        .trim();

                const image =
                    document
                        .getElementById("galleryImage")
                        .value
                        .trim();

                const title =
                    document
                        .getElementById("galleryTitle")
                        .value
                        .trim();

                const category =
                    document
                        .getElementById("galleryCategory")
                        .value;

                const caption =
                    document
                        .getElementById("galleryCaption")
                        .value
                        .trim();


                /* ==================================================
                   VALIDASI
                ================================================== */

                if (
                    !id ||
                    !title ||
                    !category
                ) {

                    showGalleryFormMessage(
                        "Mohon lengkapi data Gallery terlebih dahulu.",
                        "error"
                    );

                    return;

                }


                /* ==================================================
                   CEK GAMBAR
                ================================================== */

                if (
                    !editingGalleryId &&
                    !selectedGalleryFile
                ) {

                    showGalleryFormMessage(
                        "Silakan pilih gambar terlebih dahulu.",
                        "error"
                    );

                    return;

                }


                /* ==================================================
                   CEK ID DUPLIKAT
                ================================================== */

                if (!editingGalleryId) {

                    const duplicate =
                        galleryIds.some(
                            item =>
                                item.id.toLowerCase() ===
                                id.toLowerCase()
                        );


                    if (duplicate) {

                        showGalleryFormMessage(
                            `ID Gallery "${id}" sudah digunakan. Silakan coba lagi.`,
                            "error"
                        );

                        return;

                    }

                }
                /* ==================================================
                   BUTTON
                ================================================== */

                const saveButton =
                    galleryForm.querySelector(
                        ".save-gallery-button"
                    );


                saveButton.disabled = true;

                saveButton.textContent =
                    editingGalleryId
                        ? "Mengupdate..."
                        : "Menyimpan...";


                /* ==================================================
   MODE EDIT → UPDATE
================================================== */

                if (editingGalleryId) {

                    /* ================= IMAGE URL ================= */

                    let imageUrl =
                        editingGalleryImageUrl;


                    /* ================= UPLOAD GAMBAR BARU ================= */

                    if (selectedGalleryFile) {

                        saveButton.textContent =
                            "Mengupload...";

                        showGalleryFormMessage(
                            "Sedang mengupload gambar baru...",
                            "success"
                        );


                        const uploadedImageUrl =
                            await uploadGalleryImage(
                                selectedGalleryFile
                            );


                        /* ================= UPLOAD GAGAL ================= */

                        if (!uploadedImageUrl) {

                            showGalleryFormMessage(
                                "Gagal mengupload gambar baru. Gallery belum diperbarui.",
                                "error"
                            );


                            saveButton.disabled =
                                false;

                            saveButton.textContent =
                                "Update Gallery";

                            return;

                        }


                        imageUrl =
                            uploadedImageUrl;

                    }


                    /* ================= UPDATE DATABASE ================= */

                    saveButton.textContent =
                        "Mengupdate...";

                    showGalleryFormMessage(
                        "Sedang menyimpan perubahan Gallery...",
                        "success"
                    );


                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .from("gallery")
                            .update({

                                image_url:
                                    imageUrl,

                                category:
                                    category,

                                title:
                                    title,

                                caption:
                                    caption ||
                                    title

                            })
                            .eq(
                                "id",
                                editingGalleryId
                            )
                            .select()
                            .single();


                    /* ================= ERROR ================= */

                    if (error) {

                        console.error(
                            "❌ Gagal mengupdate Gallery:",
                            error
                        );


                        showGalleryFormMessage(
                            error.message ||
                            "Gagal mengupdate Gallery.",
                            "error"
                        );


                        saveButton.disabled =
                            false;

                        saveButton.textContent =
                            "Update Gallery";

                        return;

                    }


                    /* ================= SUCCESS ================= */

                    console.log(
                        "✅ Gallery berhasil diupdate:",
                        data
                    );


                    showGalleryFormMessage(
                        "Gallery berhasil diupdate.",
                        "success"
                    );


                    /* ================= REFRESH DATA ================= */

                    /*
                       Refresh daftar ID terlebih dahulu
                       agar Smart ID menggunakan data terbaru.
                    */

                    await loadGalleryIds();

                    /*
                       Setelah ID terbaru dimuat,
                       refresh daftar Gallery.
                    */

                    await loadAdminGallery();


                    /* ================= RESET ================= */

                    resetGalleryForm();


                    saveButton.disabled =
                        false;


                    /* ================= CLOSE ================= */

                    setTimeout(() => {

                        closeGalleryFormPanel();

                    }, 700);


                    return;

                }



                /* ==================================================
                   MODE TAMBAH → UPLOAD GAMBAR + INSERT
                ================================================== */

                /* ================= CEK FILE ================= */

                if (!selectedGalleryFile) {

                    showGalleryFormMessage(
                        "Silakan pilih gambar terlebih dahulu.",
                        "error"
                    );

                    saveButton.disabled = false;

                    saveButton.textContent =
                        "Simpan Gallery";

                    return;

                }


                /* ================= UPLOAD ================= */

                saveButton.textContent =
                    "Mengupload...";

                showGalleryFormMessage(
                    "Sedang mengupload gambar...",
                    "success"
                );


                const imageUrl =
                    await uploadGalleryImage(
                        selectedGalleryFile
                    );


                /* ================= UPLOAD GAGAL ================= */

                if (!imageUrl) {

                    showGalleryFormMessage(
                        "Gagal mengupload gambar. Data Gallery belum disimpan.",
                        "error"
                    );

                    saveButton.disabled = false;

                    saveButton.textContent =
                        "Simpan Gallery";

                    return;

                }


                /* ================= SIMPAN DATABASE ================= */

                saveButton.textContent =
                    "Menyimpan...";

                showGalleryFormMessage(
                    "Gambar berhasil diupload. Sedang menyimpan data Gallery...",
                    "success"
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("gallery")
                        .insert({

                            id: id,

                            image_url: imageUrl,

                            category: category,

                            title: title,

                            caption:
                                caption ||
                                title

                        })
                        .select()
                        .single();


                /* ================= DATABASE ERROR ================= */

                if (error) {

                    console.error(
                        "❌ Gagal menambahkan Gallery:",
                        error
                    );


                    showGalleryFormMessage(
                        error.message ||
                        "Gagal menyimpan Gallery.",
                        "error"
                    );


                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Simpan Gallery";

                    return;

                }


                /* ================= SUCCESS ================= */

                console.log(
                    "✅ Gallery berhasil ditambahkan:",
                    data
                );


                showGalleryFormMessage(
                    "Gallery berhasil ditambahkan.",
                    "success"
                );


                /* ================= REFRESH ================= */

                await loadAdminGallery();


                /* ================= RESET ================= */

                resetGalleryForm();


                saveButton.disabled =
                    false;


                /* ================= CLOSE ================= */

                setTimeout(() => {

                    closeGalleryFormPanel();

                }, 700);
            });

        /* ==================================================
           LOGOUT
        ================================================== */

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                async function () {

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signOut();


                    if (error) {

                        console.error(
                            "❌ Logout gagal:",
                            error
                        );

                        return;

                    }


                    console.log(
                        "✅ Logout berhasil."
                    );


                    window.location.href =
                        "admin-gallery.html";

                }
            );


        /* ==================================================
           INITIALIZE
        ================================================== */

        async function initAdminGallery() {

            const session =
                await checkAdminSession();

            if (!session) return;

            /* Muat ID terlebih dahulu agar Smart ID siap digunakan */

            await loadGalleryIds();

            /* Setelah ID siap, tampilkan Gallery */

            await loadAdminGallery();

        }


        initAdminGallery();

    </script>

    <button id="floatingAddGalleryButton" class="floating-add-gallery-button" type="button" aria-label="Tambah Gallery">
        +
    </button>

    <script src="js/admin-gallery.js"></script>

</body>

</html>
